<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Einstellungen</title>
<link rel="stylesheet" href="style.css">
<style>
  /* macOS settings: changes apply immediately, no Save/Cancel; sections separated by hairlines */
  .settings { display: flex; flex-direction: column; gap: 14px; }
  .settings .form { grid-template-columns: 110px 1fr; align-items: center; row-gap: 6px; }
  .note { font-size: 12px; color: var(--muted); }
  .status { display: flex; align-items: center; gap: 5px; font-size: 12px; min-height: 16px; }
  .status.ok { color: #1f8a3b; }
  @media (prefers-color-scheme: dark) { .status.ok { color: #32d74b; } }
  .status.err { color: var(--red); }
  .status a { color: var(--accent); text-decoration: none; }
  .status a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="settings" id="content">
  <div class="form">
    <label class="label" for="reader">NFC-Reader:</label>
    <select id="reader"></select>
    <span></span>
    <div class="note">Automatisch: der erste angeschlossene Reader.</div>
  </div>
  <hr>
  <div class="form">
    <label class="label" for="url">Spoolman-URL:</label>
    <div class="row">
      <input id="url" type="text" placeholder="http://192.168.1.10:7912" spellcheck="false" autocomplete="off">
      <button id="test">Prüfen</button>
    </div>
    <span></span>
    <div id="status" class="status sel" role="status" aria-live="polite"></div>
    <span></span>
    <div id="update" class="status" aria-live="polite"></div>
  </div>
  <hr>
  <div class="form">
    <span class="label">Allgemein:</span>
    <label class="row" style="gap:6px"><input id="autostart" type="checkbox"> Beim Anmelden starten</label>
    <span></span>
    <div id="error" class="status err"></div>
  </div>
</div>
<script>
const { invoke } = window.__TAURI__.core;
const $ = (id) => document.getElementById(id);

// Same self-correcting fit as the panel: ask for the content height, then make up what the title bar took.
let fitTarget = 0, fitSent = 0, fitTries = 0;
const fit = () => requestAnimationFrame(() => {
  fitTarget = Math.ceil($('content').getBoundingClientRect().height) + 2 * parseFloat(getComputedStyle(document.body).paddingTop);
  fitSent = fitTarget; fitTries = 0;
  invoke('fit_panel', { width: window.innerWidth, height: fitSent });
});
window.addEventListener('resize', () => {
  const missing = fitTarget - window.innerHeight;
  if (!fitTarget || Math.abs(missing) <= 1 || fitTries >= 3) return;
  fitTries++; fitSent += missing;
  invoke('fit_panel', { width: window.innerWidth, height: fitSent });
});

let saved = null;
const save = async () => {
  try {
    await invoke('save_settings', { baseUrl: $('url').value, reader: $('reader').value || null, autostart: $('autostart').checked });
    $('error').textContent = '';
  } catch (e) {
    $('error').textContent = String(e);
  }
};

async function test() {
  const s = $('status');
  s.className = 'status muted';
  s.textContent = 'Wird geprüft…';
  const c = await invoke('test_connection', { url: $('url').value });
  s.className = `status sel ${c.ok ? 'ok' : 'err'}`;
  s.textContent = c.ok ? `● Verbunden mit ${c.message}` : `● ${c.message}`;
  const u = $('update');
  u.replaceChildren();
  if (c.ok && c.update_available && c.latest) {
    const link = document.createElement('a');
    link.href = '#'; link.textContent = 'Versionshinweise';
    link.onclick = (e) => { e.preventDefault(); invoke('open_release_notes', { version: c.latest }); };
    u.className = 'status';
    u.append(`Update auf ${c.latest} verfügbar · `, link);
  } else if (c.ok) {
    u.className = 'status muted';
    u.textContent = 'Spoolman ist aktuell.';
  }
  fit();
}

(async () => {
  const s = await invoke('get_settings');
  const readers = [...s.readers];
  if (s.reader && !readers.includes(s.reader)) readers.push(s.reader); // keep the choice while unplugged
  $('reader').append(new Option('Automatisch', ''), ...readers.map((r) => new Option(r, r)));
  $('reader').value = s.reader || '';
  $('url').value = s.base_url;
  $('autostart').checked = s.autostart;
  saved = s.base_url;
  fit();
  test();
})();

$('reader').onchange = save;
$('autostart').onchange = save;
// URL: apply when editing ends (Enter or leaving the field), then check the connection
const commitUrl = async () => {
  if ($('url').value.trim() === saved) return;
  saved = $('url').value.trim();
  await save();
  test();
};
$('url').addEventListener('change', commitUrl);
$('url').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); commitUrl(); } });
$('test').onclick = test;
document.addEventListener('keydown', async (e) => {
  if (e.key === 'Escape') { await commitUrl(); window.__TAURI__.window.getCurrentWindow().close(); }
});
</script>
</body>
</html>
